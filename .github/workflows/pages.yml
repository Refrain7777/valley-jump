name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pygbag and build web game
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-microhei
          pip install pygbag pillow pygame-ce
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy python bake_glyphs.py
          PYTHONUTF8=1 python -m pygbag --build --ume_block 0 --width 960 --height 540 --template valley.tmpl --title "valley-jump" .
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
